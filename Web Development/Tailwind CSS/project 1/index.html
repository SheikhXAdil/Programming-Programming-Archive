<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Facebook-logo.png" />
    <title>Facebook – log in or sign up</title>
</head>
<body class="bg-gray-100">
    <div class="flex items-center justify-center mt-32 m-auto">
        <div class="left w-1/3 mx-14">
            <img class="w-60" src="facebook logo.svg" alt="fb logo">
            <p class="text-2xl mx-6">Facebook helps you connect and share with the people in your life</p>
        </div>
        <div class="right flex flex-col bg-white p-4 rounded-md w-1/3 text-lg relative shadow-gray-300 shadow-xl">
            <input class="p-4 h-14 my-2 border border-1 outline-blue-400 border-gray-200 rounded-lg" type="text" placeholder="Email address or phone number">
            <input class="p-4 h-14 my-2 border border-1 outline-blue-400 border-gray-200 rounded-lg" type="password" placeholder="Password">
            <button class="bg-blue-600 hover:bg-blue-700 text-white my-2 py-2 rounded-md font-bold">Login</button>
            <span class="text-blue-600 text-center text-sm my-2 cursor-pointer hover:underline">Forgotten password?</span>
            <hr class="my-2">
            <button class="bg-green-500 hover:bg-green-600 text-white my-2 py-2 rounded-md font-bold w-fit px-4 mx-auto">Create New Account</button>
            <span class="absolute -bottom-12 left-6 text-sm"><span class="font-bold hover:underline hover:cursor-pointer">Create a Page</span> for a celebrity, brand or business.</span>
        </div>
    </div>
</body>
</html>
