<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="image slider.css">
    <script src="https://kit.fontawesome.com/60afd21d5a.js" crossorigin="anonymous"></script>
    <title>Javascript Image Slider</title>
</head>
<body>

    <div class="main">
        <div class="images">
            <img src="image/1.jpg">
            <img src="image/2.jpg">
            <img src="image/3.jpg">
            <img src="image/4.jpg">
            <img src="image/5.jpg">
            <img src="image/6.jpg">

            <div onclick="side_slide(1)" class="slider left">
                <i class="fa-solid fa-arrow-left"></i></div>
            </div>
            <div onclick="side_slide(-1)" class="slider right">
                <i class="fa-solid fa-arrow-right"></i>
            </div>  
            <div class="btn-sliders">
                <span onclick="btn_show(1)"></span>
                <span onclick="btn_show(2)"></span>
                <span onclick="btn_show(3)"></span>
                <span onclick="btn_show(4)"></span>
                <span onclick="btn_show(5)"></span>
                <span onclick="btn_show(6)"></span>
            </div>      
        </div>
    </div>
    <script src="image slider.js" type="text/javascript"></script>
</body>
</html>
